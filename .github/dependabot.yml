# 使っているパッケージに更新や脆弱性の修正が出たら、自動でプルリクエストを作る
version: 2
updates:
  - package-ecosystem: npm # pnpm のロックファイルにも対応している
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      # 小さな更新はまとめて1つのプルリクエストにする
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
